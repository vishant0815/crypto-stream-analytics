name: crypto-stream-analytics

# Shared settings for the HDFS containers. The apache/hadoop image turns
# variables named FILE.XML_property into Hadoop configuration files.
x-hadoop-env: &hadoop-env
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.namenode.name.dir: /data/namenode
  HDFS-SITE.XML_dfs.datanode.data.dir: /data/datanode
  HDFS-SITE.XML_dfs.replication: "1"            # one DataNode, so one copy of each block
  HDFS-SITE.XML_dfs.permissions.enabled: "false"

# Shared settings for the Spark jobs that use HDFS and Hive
x-spark-lake-env: &spark-lake-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  DATABASE_URL: postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-crypto}@timescaledb:5432/${POSTGRES_DB:-crypto}
  HDFS_ROOT: hdfs://namenode:8020

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092"   # for clients on your machine
    environment:
      # Single node in KRaft mode (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers, EXTERNAL for your machine
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose by kafka-init, never by accident
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1 --config retention.ms="$$3"
        }
        DAY=86400000
        create raw.trades   6 $$((7 * DAY))
        create raw.ticker   6 $$((2 * DAY))
        create agg.metrics  3 $$((1 * DAY))
        create alerts       1 $$((30 * DAY))
        create dlq.trades   1 $$((7 * DAY))
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  ingestion:
    build: ../ingestion
    container_name: ingestion
    env_file:
      - path: ../.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.22.1-pg16
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      # Schema runs automatically on the first start of an empty database
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-writer:
    build: ../db-writer
    container_name: db-writer
    env_file:
      - path: ../.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-crypto}@timescaledb:5432/${POSTGRES_DB:-crypto}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  spark-streaming:
    build: ../spark
    container_name: spark-streaming
    ports:
      - "4040:4040"   # Spark UI: streaming query progress, batch times, state size
    env_file:
      - path: ../.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-crypto}@timescaledb:5432/${POSTGRES_DB:-crypto}
    volumes:
      - spark-checkpoints:/data/checkpoints
    # Time to stop the streaming queries cleanly before Docker kills the container
    stop_grace_period: 30s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    container_name: redis
    # Cache and latest live state only: nothing here needs to survive a restart
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../api
    container_name: api
    ports:
      - "8000:8000"   # REST API and docs at http://localhost:8000/docs
    env_file:
      - path: ../.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-crypto}@timescaledb:5432/${POSTGRES_DB:-crypto}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/pairs', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dashboard:
    build: ../dashboard
    container_name: dashboard
    ports:
      - "3000:80"     # the live dashboard: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  namenode:
    image: apache/hadoop:3.4.2
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # HDFS web UI: browse the archive at Utilities > Browse the file system
    environment:
      <<: *hadoop-env
      ENSURE_NAMENODE_DIR: /data/namenode   # format HDFS on first start only
    volumes:
      - namenode-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  datanode:
    image: apache/hadoop:3.4.2
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    environment:
      <<: *hadoop-env
    volumes:
      - datanode-data:/data
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped

  spark-archive:
    build: ../spark
    container_name: spark-archive
    command: ["lake.archive_job"]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *spark-lake-env
    stop_grace_period: 30s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      datanode:
        condition: service_started
    restart: unless-stopped

  spark-batch:
    build: ../spark
    container_name: spark-batch
    # Nightly at BATCH_TIME_UTC: the day's batch, then retraining of the anomaly model
    command: ["lake.scheduler"]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *spark-lake-env
    stop_grace_period: 30s
    depends_on:
      timescaledb:
        condition: service_healthy
      datanode:
        condition: service_started
    restart: unless-stopped

volumes:
  kafka-data:
  timescale-data:
  spark-checkpoints:
  namenode-data:
  datanode-data:
