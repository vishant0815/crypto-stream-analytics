# Rate limits, per visitor IP. The dashboard makes a handful of REST calls on load
# and a few every 10 seconds, so 10 a second with a burst of 40 is never reached by
# a real browser; a script hammering the API gets 429 Too Many Requests.
limit_req_zone  $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ws:10m;
limit_req_status  429;
limit_conn_status 429;

# Behind the HTTPS proxy (Caddy) every request comes from the proxy's address;
# take the visitor's real IP from X-Forwarded-For, trusting private networks only.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# WebSocket upgrades only when the browser asks for one
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        limit_conn ws 5;   # a few tabs per visitor
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;   # live connections stay open
    }

    # Grafana (pipeline health), served from /grafana/ so the whole site has one
    # address. Looked up through Docker's DNS when a request comes in, so the
    # dashboard still starts if Grafana isn't running.
    location /grafana/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # Grafana Live uses WebSockets
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri /index.html;
    }
}
