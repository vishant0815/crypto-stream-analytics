# Prometheus scrapes every service's /metrics every 5 s. The pipeline moves
# second by second, so a short interval keeps the Grafana charts honest.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingestion        # Coinbase WebSocket -> Kafka
    static_configs:
      - targets: ["ingestion:9101"]

  - job_name: db-writer        # Kafka -> TimescaleDB
    static_configs:
      - targets: ["db-writer:9102"]

  - job_name: spark            # Structured Streaming jobs, one label per query
    static_configs:
      - targets: ["spark-streaming:9103", "spark-archive:9103"]

  - job_name: api              # FastAPI REST + WebSocket
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: kafka            # topic offsets and consumer group lag
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
